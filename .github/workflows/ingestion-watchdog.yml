name: Ingestion Watchdog

# Emits a logfire error event if ingestion freshness or serving health
# fails; the "watchdog: ingestion stalled" logfire alert routes it to the
# pub-search ingestion alerts Discord channel (same pipeline as every other
# alert). Direct Discord webhook is the fallback if the logfire emit fails.
# Deliberately not bsky, so an atproto outage can't eat its own alert.
# Dedup: only the first failing run in a 3h window emits (reads this
# workflow's run history via GITHUB_TOKEN).
#
# Requires repo secrets: LOGFIRE_TOKEN, TURSO_DB_TOKEN. Optional:
# DISCORD_WEBHOOK_URL (fallback), PREFECT_API_URL + PREFECT_API_AUTH_STRING
# (builder cause-level check).

on:
  schedule:
    - cron: '*/15 * * * *' # every 15 min
  workflow_dispatch: # allow manual trigger

permissions:
  actions: read # dedup reads this workflow's recent run conclusions

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Check ingestion (posts to discord + fails the run if stalled)
        env:
          LOGFIRE_TOKEN: ${{ secrets.LOGFIRE_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TURSO_DB_TOKEN: ${{ secrets.TURSO_DB_TOKEN }}
          PREFECT_API_URL: ${{ secrets.PREFECT_API_URL }}
          PREFECT_API_AUTH_STRING: ${{ secrets.PREFECT_API_AUTH_STRING }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/ingestion-watchdog
