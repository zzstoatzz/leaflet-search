name: Ingestion Watchdog

# Alerts the Discord ops channel (same one logfire alerts use) if ingestion
# freshness or serving health fails — deliberately not bsky, so an atproto
# outage can't eat its own alert. Freshness = max(indexed_at) in turso
# (catches the whole ingest chain dying); serving = backend endpoints with
# bodies inspected. Dedup: only the first failing run in a 3h window posts
# (reads this workflow's run history via GITHUB_TOKEN).
#
# Requires repo secrets: DISCORD_WEBHOOK_URL, TURSO_DB_TOKEN. Optional:
# PREFECT_API_URL + PREFECT_API_AUTH_STRING (builder cause-level check).

on:
  schedule:
    - cron: '*/15 * * * *' # every 15 min
  workflow_dispatch: # allow manual trigger

permissions:
  actions: read # dedup reads this workflow's recent run conclusions

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Check ingestion (posts to discord + fails the run if stalled)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TURSO_DB_TOKEN: ${{ secrets.TURSO_DB_TOKEN }}
          PREFECT_API_URL: ${{ secrets.PREFECT_API_URL }}
          PREFECT_API_AUTH_STRING: ${{ secrets.PREFECT_API_AUTH_STRING }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/ingestion-watchdog
