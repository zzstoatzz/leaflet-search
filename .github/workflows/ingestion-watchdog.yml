name: Ingestion Watchdog

# Emits a logfire error event if ingestion freshness or serving health
# fails; the "watchdog: ingestion stalled" logfire alert routes it to the
# pub-search ingestion alerts Discord channel — logfire is the single
# alerting path (no secondary delivery; a failed emit still fails the run,
# which is the backstop). Deliberately not bsky, so an atproto outage can't
# eat its own alert. Dedup: only the first failing run in a 3h window emits
# (reads this workflow's run history via GITHUB_TOKEN).
#
# Requires repo secrets: LOGFIRE_TOKEN, TURSO_DB_TOKEN. Optional:
# PREFECT_API_URL + PREFECT_API_AUTH_STRING (builder cause-level check).

on:
  schedule:
    - cron: '*/15 * * * *' # every 15 min
  workflow_dispatch: # allow manual trigger

permissions:
  actions: read # dedup reads this workflow's recent run conclusions

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Check ingestion (posts to discord + fails the run if stalled)
        env:
          LOGFIRE_TOKEN: ${{ secrets.LOGFIRE_TOKEN }}
          TURSO_DB_TOKEN: ${{ secrets.TURSO_DB_TOKEN }}
          PREFECT_API_URL: ${{ secrets.PREFECT_API_URL }}
          PREFECT_API_AUTH_STRING: ${{ secrets.PREFECT_API_AUTH_STRING }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/ingestion-watchdog
