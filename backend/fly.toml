app = 'leaflet-search-backend'
primary_region = 'ewr'

[build]

[env]
  # Overlay rollout: writes flow + compact on adoption (OVERLAY_WRITE), and
  # serving merges live-overlay hits (OVERLAY_SERVE — Stage 3, flipped
  # 2026-08-13 after 4 clean compaction cycles + A/B parity + the positive
  # freshness case). ?overlay=0 remains the per-request escape hatch.
  OVERLAY_WRITE = '1'
  OVERLAY_SERVE = '1'
  ENABLE_SNAPSHOT_PROMOTE = '1'
  PROMOTE_CHANNEL = 'prod'
  INGESTER_HOST = 'leaflet-search-ingester.internal'
  INGESTER_PORT = '2480'
  INGESTER_RELAY_URL = 'https://relay.waow.tech'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

# labeler XRPC (com.atproto.label.*) on its own port. Cloudflare proxies
# labeler.pub-search.waow.tech → this :8443 (fly routes by external port, so the
# labeler needs a distinct one from the main :443 app).
[[services]]
  internal_port = 3001
  protocol = 'tcp'
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 8443
    handlers = ['tls', 'http']

[mounts]
  source = 'leaflet_data'
  destination = '/data'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
