app = 'leaflet-search-backend'
primary_region = 'ewr'

[build]

[env]
  # Overlay rollout: writes flow + compact on adoption (OVERLAY_WRITE), and
  # serving merges live-overlay hits (OVERLAY_SERVE — Stage 3, flipped
  # 2026-08-13 after 4 clean compaction cycles + A/B parity + the positive
  # freshness case). ?overlay=0 remains the per-request escape hatch.
  OVERLAY_WRITE = '1'
  OVERLAY_SERVE = '1'
  ENABLE_SNAPSHOT_PROMOTE = '1'
  PROMOTE_CHANNEL = 'prod'
  # adopt once a day off-peak (08:00 UTC = 4am ET): every adoption cold-starts
  # the page cache, and the overlay carries freshness between adoptions
  PROMOTE_ADOPT_UTC_HOURS = '8'

# app/worker split (plyr.fm's pattern): serving + ingest + labeler on `app`
# (everything touching the /data volume), the noisy stateless tenants
# (reconciler's PDS-check storms, embedder batches) on `worker` so background
# bursts never share a vCPU with search. Keep `worker` at exactly ONE machine
# — the embedder must be a single writer (turso DiskANN).
[processes]
  app = "sh -c 'PROCESS_ROLE=app exec ./pub-search'"
  worker = "sh -c 'PROCESS_ROLE=worker exec ./pub-search'"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

# labeler XRPC (com.atproto.label.*) on its own port. Cloudflare proxies
# labeler.pub-search.waow.tech → this :8443 (fly routes by external port, so the
# labeler needs a distinct one from the main :443 app).
[[services]]
  internal_port = 3001
  protocol = 'tcp'
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[services.ports]]
    port = 8443
    handlers = ['tls', 'http']

[mounts]
  source = 'leaflet_data'
  destination = '/data'
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
